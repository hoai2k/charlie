<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Browsers only allow the camera on https:// pages.
      if (location.protocol === "http:" && !["localhost", "127.0.0.1"].includes(location.hostname)) {
        location.replace("https:" + location.href.slice(5));
      }
    </script>
    <title>Doll Puppets</title>
    <link rel="icon" type="image/png" href="./favicon.png?v=20261002b" />
    <link rel="apple-touch-icon" href="./favicon.png?v=20261002b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" />
    <link rel="stylesheet" href="./site.css?v=20261002e" />
  </head>
  <body>
    <main class="dolls-app" data-screen="title" style="--background-image: url('./assets/backgrounds/farm.webp')">
      <div class="scene-background" aria-hidden="true"></div>
      <video id="camera" playsinline muted aria-hidden="true"></video>
      <canvas id="doll-canvas" aria-label="AR doll scene"></canvas>

      <!-- In-game controls -->
      <div class="game-hud">
        <button id="open-select" class="hud-button" type="button">
          <span class="hud-icon" aria-hidden="true">★</span><span>Dolls</span>
        </button>
        <button id="pause-game" class="hud-button pause-button" type="button" aria-pressed="false">
          <span class="hud-icon" aria-hidden="true">❚❚</span><span class="hud-label">Pause</span>
        </button>
      </div>
      <aside id="gesture-hints" class="gesture-hints" aria-label="Faces to try" hidden>
        <strong>Try this!</strong>
        <img src="./assets/ui/try_these.webp" width="960" height="160" alt="Smile, laugh, blow a kiss, stick out your tongue, look surprised, or make a heart with your hands." />
        <button id="dismiss-hints" type="button" aria-label="Close face hints">×</button>
      </aside>
      <div class="notice-stack">
        <p id="status" class="status" role="status"></p>
        <button id="camera-retry" class="camera-retry" type="button" hidden>Try again</button>
      </div>

      <!-- Title screen: pick a doll and you're straight into the game -->
      <section id="title-screen" class="title-screen" aria-label="Doll Puppets">
        <div class="title-glow" aria-hidden="true"></div>
        <h1 class="logo" aria-label="Doll Puppets">
          <span class="logo-small">Doll</span>
          <span class="logo-big">Puppets</span>
        </h1>
        <p class="tagline">Tap a doll to play!</p>

        <div id="character-list" class="character-list" role="listbox" aria-label="Dolls"></div>

        <div class="scene-picker">
          <span class="scene-label">Scene</span>
          <div id="background-list" class="background-list" role="listbox" aria-label="Scenes"></div>
        </div>

        <p class="camera-note">Your doll copies your face using the camera. Nothing is recorded.</p>

        <div id="debug-tools" class="debug-tools" hidden>
          <button id="download-debug" class="debug-button" type="button">Download Debug Capture</button>
        </div>
      </section>
    </main>

    <script type="module" src="./site.js?v=20261002e"></script>
  </body>
</html>
