<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doll Puppets</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./site.css" />
  </head>
  <body>
    <main class="dolls-app" style="--background-image: url('./assets/backgrounds/farm.png')">
      <div class="scene-background" aria-hidden="true"></div>
      <video id="camera" playsinline muted aria-hidden="true"></video>
      <canvas id="doll-canvas" aria-label="AR doll scene"></canvas>

      <button id="pause-game" class="pause-button" type="button" aria-pressed="false">Pause</button>
      <p id="status" class="status" role="status"></p>

      <button
        id="settings-toggle"
        class="settings-button"
        type="button"
        aria-expanded="false"
        aria-controls="settings-panel"
      >
        Settings
      </button>

      <section id="settings-panel" class="settings-panel" aria-label="Settings" hidden>
        <header class="settings-header">
          <h1>Settings</h1>
          <button id="settings-close" class="icon-button" type="button" aria-label="Close settings">x</button>
        </header>

        <label class="field">
          <span>Character</span>
          <select id="character-select">
            <option value="rumi" selected>Rumi</option>
          </select>
        </label>

        <div class="field">
          <span>Background</span>
          <div id="background-list" class="background-list" role="listbox" aria-label="Background choices"></div>
        </div>

        <div id="debug-tools" class="debug-tools" hidden>
          <button id="download-debug" class="debug-button" type="button">Download Debug Capture</button>
        </div>
      </section>
    </main>

    <script type="module" src="./site.js"></script>
</body>
</html>
