<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Charlie's Games</title>
    <style>
      :root { --bg: #fff7fb; --fg: #3a2440; --card: #ffffff; --accent: #d6438a; --muted: #7a5f80; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1e1622; --fg: #f6eaf7; --card: #2c2131; --accent: #ff7fb8; --muted: #b9a3bd; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 2.4rem; margin: 0 0 4px; }
      p.sub { color: var(--muted); margin: 0 0 32px; }
      ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 16px;
           grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      a.card { display: flex; align-items: center; gap: 14px; padding: 18px; border-radius: 16px;
               background: var(--card); color: inherit; text-decoration: none;
               box-shadow: 0 2px 10px rgb(0 0 0 / 0.08); border: 2px solid transparent; }
      a.card:hover, a.card:focus-visible { border-color: var(--accent); }
      a.card img { width: 48px; height: 48px; border-radius: 10px; }
      a.card span { font-weight: 600; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Charlie's Games</h1>
      <p class="sub">Pick a game to play.</p>
      <ul>
        <li>
          <a class="card" href="americangirldollrace/">
            <img src="americangirldollrace/favicon.png" alt="">
            <span>American Girl Doll Race</span>
          </a>
        </li>
        <li>
          <a class="card" href="dollpuppets/">
            <img src="dollpuppets/favicon.png" alt="">
            <span>Doll Puppets</span>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
