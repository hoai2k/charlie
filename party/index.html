      body { touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas { display: block; outline: none; position: fixed; left: 0; top: 0; }
      /* iPhone Safari has no fullscreen, but it hides its bars when the page
         scrolls in landscape, so there the page is made taller than the screen
         (src/engine/shell.js). The canvas is fixed and follows what's visible. */
      html.ios-scroll, html.ios-scroll body { height: auto; overflow-x: hidden; overflow-y: auto; }
      html.ios-scroll body { touch-action: pan-y; }
      html.ios-scroll body::after { content: ''; display: block; height: calc(100lvh + 160px); }
      html.ios-scroll.ios-scroll-play, html.ios-scroll.ios-scroll-play body { overflow: hidden; touch-action: none; }
      #bars-hint { position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); z-index: 5;
        background: #2a1650ee; border: 2px solid #ffd23f; color: #fff; padding: 8px 16px; border-radius: 20px;
        font: 600 15px Fredoka, system-ui, sans-serif; white-space: nowrap; pointer-events: none; }
      #bars-hint[hidden] { display: none; }
      #bars-hint .arrow { display: inline-block; animation: nudge 1.4s ease-in-out infinite; color: #ffd23f; font-weight: 700; }
      @keyframes nudge { 50% { transform: translateY(-4px); } }
      noscript { color: #fff; font: 20px system-ui, sans-serif; position: absolute; inset: 40px; }
    </style>
