<!doctype html><html><head><meta charset="utf-8"><base href="../../"><title>Molly reaction art review</title><style>body{margin:0;background:#fff3e7;color:#24163f;font:18px sans-serif}h1,p{margin:16px}canvas{display:block;width:100%;height:auto}</style></head><body><h1>Molly grown-up reactions</h1><p>Final runtime images rendered by the game's own drawing functions. Troll decorations remain separate.</p><canvas id="review" width="1920" height="1080"></canvas><script type="module">
import {loadArt,art} from './src/engine/art.js';
import {drawTeacher} from './src/games/opposite-ballet/art.js';
import {drawTroll,configureTrollArt} from './src/games/prank-troll/draw.js';
await loadArt({only:k=>k.startsWith('prop/oballet-teacher-')||k.startsWith('prop/ptroll-')});
const g=document.querySelector('canvas').getContext('2d');g.fillStyle='#fff3e7';g.fillRect(0,0,1920,1080);g.fillStyle='#24163f';g.font='28px sans-serif';
for(const [x,react] of [[290,'huff'],[780,'shock']]){g.fillText('Madame Papillon: '+react,x-180,70);drawTeacher(g,x,780,630,0,null,0,1,{react,fluster:1});}
configureTrollArt(true);g.fillText('Troll: shock + separate pranks',1200,70);g.save();g.translate(460,50);drawTroll(g,{awake:true,breath:0,sway:0,bob:0},{tache:1,flowers:['#ff7ac6','#ffd23f','#7fc8ff'],bows:2,hats:1,glitter:0,toes:10},0,null,art('prop/ptroll-troll-shock'));g.restore();
document.body.dataset.ready='true';
</script><h1>Granny Goose reactions</h1><canvas id="granny" width="1920" height="700"></canvas><script type="module">
import {loadArt} from './src/engine/art.js';
import {Game} from './src/games/muddy-mayhem.js';
await loadArt({only:k=>k.startsWith('prop/mm-granny')});
const g=document.querySelector('#granny').getContext('2d');g.fillStyle='#fff3e7';g.fillRect(0,0,1920,700);g.fillStyle='#24163f';g.font='28px sans-serif';
for(const [x,state,react] of [[300,'gasp','scold'],[850,'gasp','huff'],[1430,'sit','shock']]){g.fillText('Granny: '+react,x-100,60);Game.prototype.drawGranny.call({t:0,grannyScale:()=>1.8,granny:{x,y:600,state,react,st:0.4,step:0,sq:0,z:0,rot:0,facing:1,mud:1,say:react==='scold'?'Tsk tsk!':'Hmph!'}},g);}
</script><h1>Whoopee Tea guests</h1><canvas id="guests" width="1920" height="1800"></canvas><script type="module">
import {loadArt} from './src/engine/art.js';
import {drawGuest,drawGuestFx,drawChairBack,drawChairFront} from './src/games/whoopee-tea/art.js';
await loadArt({only:k=>k.startsWith('prop/whoopee-')});
const g=document.querySelector('#guests').getContext('2d');g.fillStyle='#fff3e7';g.fillRect(0,0,1920,1800);g.fillStyle='#24163f';g.font='28px sans-serif';
for(const [r,kind] of ['poodle','bunny','pig','kitty'].entries())for(const [c,state] of ['shock','scold','huff'].entries()){const x=300+c*600,y=430+r*450;g.fillText(kind+': '+state,x-100,y-340);drawChairBack(g,x,y+80,1);drawChairFront(g,x,y+80,1);drawGuest(g,kind,x,y-6,300,state,{hat:true,t:0,facing:1});drawGuestFx(g,kind,x,y-6,300,state,state==='scold'?['scold']:[],0,1);}
</script><h1>Hoot and Nanny Moo</h1><canvas id="grownups" width="1920" height="700"></canvas><script type="module">
import {loadArt,drawArt} from './src/engine/art.js';
import {drawHoot} from './src/games/sneaky-dance/draw.js';
await loadArt({only:k=>k.startsWith('prop/sd-hoot-')||k.startsWith('prop/nanny-moo')});
const g=document.querySelector('#grownups').getContext('2d');g.fillStyle='#fff3e7';g.fillRect(0,0,1920,700);g.fillStyle='#24163f';g.font='28px sans-serif';
for(const [x,state] of [[270,'scold'],[730,'shock']]){g.fillText('Professor Hoot: '+state,x-140,70);g.save();g.translate(x,560);drawHoot(g,{t:0,artKey:'prop/sd-hoot-'+state});g.restore();}
for(const [x,key,h] of [[1160,'prop/nanny-moo-peek-scold',400],[1630,'prop/nanny-moo-shock',500]]){g.fillText(key.includes('peek')?'Nanny: peek scold':'Nanny: shock',x-120,70);drawArt(g,key,x,580,h*0.8,h,{anchor:'bottom'});}
</script><h1>Duchess Teddy and the butler</h1><canvas id="royals" width="1920" height="600"></canvas><script type="module">
import {loadArt} from './src/engine/art.js';
import {drawGuest,drawGuestFx,drawButler,drawThrone} from './src/games/whoopee-tea/art.js';
await loadArt({only:k=>k.startsWith('prop/whoopee-')});
const g=document.querySelector('#royals').getContext('2d');g.fillStyle='#fff3e7';g.fillRect(0,0,1920,600);g.fillStyle='#24163f';g.font='28px sans-serif';
g.fillText('Duchess: authored scold + separate steam',300,70);drawThrone(g,600,550);drawGuest(g,'duchess',600,460,350,'scold',{hat:false,t:0});drawGuestFx(g,'duchess',600,460,350,'scold',['scold','steam'],0);
g.fillText('Butler: authored glove attached to flipper',1100,70);drawButler(g,1350,530,350,0,1,0,1,true);
</script></body></html>
