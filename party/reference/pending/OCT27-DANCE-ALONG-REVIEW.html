<!doctype html><meta charset="utf-8"><base href="../../"><title>Madame Papillon dance review</title>
<style>body{font:18px sans-serif;background:#fff3e7;color:#24163f}canvas{width:100%;max-width:1920px}</style>
<h1>Madame Papillon: Dance Along</h1><p>Actual game teacher renderer at 360px height. All poses share a full canvas and support line. Star jump is airborne; splits lower her head naturally.</p><canvas width="1920" height="1080"></canvas>
<script type="module">
import {loadArt,ensureGameArt,art,requestedKeys} from './src/engine/art.js';
import {drawTeacher} from './src/games/opposite-ballet/art.js';
await loadArt({only:k=>k==='prop/dance-move-twirl'});await ensureGameArt('opposite-ballet');
const moves=['disco','starfish','hula','cartwheel','cancan','splits','moonwalk','twirl'],g=document.querySelector('canvas').getContext('2d');
g.fillStyle='#fff3e7';g.fillRect(0,0,1920,1080);g.font='26px sans-serif';
for(const[i,m]of moves.entries()){
 const x=240+i%4*480,y=500+Math.floor(i/4)*520;
 g.fillStyle='#24163f';g.fillText(m,x-190,y-420);
 g.strokeStyle='#beaa97';g.beginPath();g.moveTo(x-200,y-24);g.lineTo(x+200,y-24);g.stroke();
 drawTeacher(g,x,y,360,0,m,.5,1);
 const key=m==='twirl'?'prop/ballet-teacher-twirl':'prop/oballet-teacher-'+m;
 if(!art(key)||!requestedKeys.has(key))throw Error('Missing authored pose: '+m);
}
g.drawImage(art('prop/dance-move-twirl'),1760,20,120,120);
document.body.dataset.ready='true';
</script>
