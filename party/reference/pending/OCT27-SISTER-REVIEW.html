<!doctype html><meta charset="utf-8"><base href="../../"><title>Sister action review</title><style>body{font:18px sans-serif;background:#fff3e7;color:#24163f}canvas{width:100%}a,select{margin:12px;font:inherit}</style><h1>Sister action sprite review</h1><p>Actual game Actor rendering. Full and optimized pictures use the same display scale. The line is the support/virtual ground.</p><select></select><a id="full">Full pictures</a><a id="optimized">Optimized pictures</a><canvas width="2000" height="1000"></canvas><script type="module">
import {Actor,loadSprites,ensureSpriteSet,getSpriteSet} from './src/engine/sprites.js';
import {CHARACTERS,FELLOWFOX,MOLLY_FAIRIES} from './src/data/characters.js';
const entries=[...CHARACTERS,FELLOWFOX,...MOLLY_FAIRIES],params=new URLSearchParams(location.search),id=params.get('char')||'felicity';
const select=document.querySelector('select');for(const c of entries){const o=document.createElement('option');o.value=c.id;o.textContent=c.name;select.append(o);}select.value=id;select.onchange=()=>location.search='?char='+select.value+'&quality='+(params.get('quality')||'full');
for(const q of ['full','optimized'])document.querySelector('#'+q).href='reference/pending/OCT27-SISTER-REVIEW.html?char='+id+'&quality='+q;
await loadSprites();const c=entries.find(c=>c.id===id)||entries[0];await Promise.all(c.members.map(m=>ensureSpriteSet(m.asset)));
const cells=[['idle',0],['boop',0],['cuddle',0],['silly-pose',0],['tiptoe',0],['tongue-out',0],['tuck',0],['ride-sit',0],['laugh',0]];
await Promise.all(c.members.flatMap(m=>cells.flatMap(([p])=>(getSpriteSet(m.asset)?.poses[p]?.frames||[]).map(f=>f.load?.()))));
const g=document.querySelector('canvas').getContext('2d');g.fillStyle='#fff3e7';g.fillRect(0,0,2000,1000);g.font='22px sans-serif';
for(const[i,[pose,t]]of cells.entries()){const x=200+(i%5)*400,y=425+Math.floor(i/5)*500;const a=new Actor(c.id,{x,y,scale:180/c.members[0].h,outfit:null});a.snap();a.setPose(pose);a.poseTime=t;a.speed=1;g.fillStyle='#24163f';g.fillText(pose+' '+t+(getSpriteSet(c.members[0].asset)?.poses[pose]?'':' FALLBACK'),x-180,y-350);g.strokeStyle='#d9c5b0';g.beginPath();g.moveTo(x-180,y);g.lineTo(x+180,y);g.stroke();a.draw(g,{shadow:false,emotes:false});}document.body.dataset.ready='true';
</script>
