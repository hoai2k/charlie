<!doctype html><meta charset="utf-8"><title>Dino critter anchor review</title><style>body{margin:0;background:#24163f}canvas{width:100vw;display:block}</style><canvas width="1920" height="1080"></canvas><script>
const c=document.querySelector('canvas'),g=c.getContext('2d');
const load=src=>new Promise((resolve,reject)=>{const i=new Image;i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
let bg,atlas,type='scorpion';window.reviewReady=false;
window.drawReview=async(name)=>{type=name;bg||=await load('../../assets/art/bg/dino-dig.webp');atlas=await load('../../assets/art/prop/dino-'+name+'.webp');g.clearRect(0,0,1920,1080);g.drawImage(bg,0,0,1920,1080);g.fillStyle='#24163f';g.font='bold 32px sans-serif';g.fillText(name+': authored pop frames0/1, flee frames2/3; top right-facing, bottom mirrored',80,70);let samples=[];for(let row=0;row<2;row++)for(let f=0;f<4;f++){const x=320+f*420,y=row?1010:770,w=name==='snake'?170:190,s=w/256;g.save();g.translate(x,y);g.scale(row?-1:1,1);g.drawImage(atlas,f*256,0,256,256,-128*s,-224*s,w,w);g.restore();g.strokeStyle='#625d46';g.lineWidth=2;g.beginPath();g.moveTo(x-105,y);g.lineTo(x+105,y);g.stroke();g.fillStyle='#24163f';g.font='22px sans-serif';g.fillText((f<2?'pop':'flee')+' frame'+f,x-75,y+30);samples.push({frame:f,facing:row?'left':'right',anchor:[x,y],sourceAnchor:[128,224],cell:[256,256],drawWidth:w})}window.review={type,atlas:[atlas.width,atlas.height],samples,consumer:'Isolated exact requested draw formula; dig-anywhere code absent from published refs',source:'actual bg/dino-dig'};window.reviewReady=true;return window.review};window.drawReview('scorpion');
</script>
